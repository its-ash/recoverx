name: recoverx
description: "git "
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared theme (local path; swap for git ref on pub publish)
  theme:
    path: ../theme

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Background work
  workmanager: ^0.10.10

  # Storage / files
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Database (scan results)
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.24

  # Media
  video_player: ^2.9.2

  # Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^13.2.0

  # Util
  crypto: ^3.0.6
  collection: ^1.18.0
  uuid: ^4.5.1
  google_fonts: ^8.2.1

  # On-device sensitive-content check (assets/models/README.md)
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/nsfw_mobilenet_v2_224.tflite